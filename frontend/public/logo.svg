<svg width="200" height="250" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradien modern -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0052CC" stop-opacity="1"/>
    </linearGradient>
    
    <!-- Glow effect filter -->
    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft shadow -->
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Glow background layer -->
  <g opacity="0.1" filter="url(#glowEffect)">
    <path fill="#0052CC" d="M100,15 Q145,15 145,60 L145,125 Q145,165 100,165 Q55,165 55,125 L55,60 Q55,15 100,15 Z" />
  </g>

  <!-- Main logo shape dengan glow -->
  <g filter="url(#softShadow)">
    <!-- Bentuk hexagon dengan sudut membulat -->
    <path fill="url(#blueGradient)" d="M100,20 Q140,20 140,60 L140,120 Q140,160 100,160 Q60,160 60,120 L60,60 Q60,20 100,20 Z" />
    
    <!-- Bentuk putih seperti buku terbuka di tengah -->
    <path fill="#FFFFFF" opacity="0.95" d="M100,40 Q125,60 125,100 Q125,130 100,130 Q75,130 75,100 Q75,60 100,40 Z" />
    
    <!-- Lingkaran putih di atas tengah (cahaya/spark) -->
    <circle cx="100" cy="50" r="15" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Detail highlight pada lingkaran -->
    <circle cx="97" cy="47" r="6" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Teks "OTRIS AI" dengan font modern -->
  <text x="100" y="220" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="32" font-weight="700" 
        fill="#0052CC" text-anchor="middle" letter-spacing="-0.5">
    OTRIS AI
  </text>
</svg>
