<svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="blueGradientHorizontal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0052CC" stop-opacity="1"/>
    </linearGradient>
    
    <filter id="glowEffectHorizontal" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softShadowHorizontal" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Icon on left -->
  <g filter="url(#softShadowHorizontal)">
    <!-- Glow background -->
    <g opacity="0.08">
      <path fill="#0052CC" d="M40,8 Q62,8 62,28 L62,52 Q62,72 40,72 Q18,72 18,52 L18,28 Q18,8 40,8 Z" />
    </g>
    
    <!-- Main shape -->
    <path fill="url(#blueGradientHorizontal)" d="M40,10 Q61,10 61,28 L61,52 Q61,70 40,70 Q19,70 19,52 L19,28 Q19,10 40,10 Z" />
    
    <!-- Inner book shape -->
    <path fill="#FFFFFF" opacity="0.95" d="M40,22 Q53,30 53,46 Q53,58 40,58 Q27,58 27,46 Q27,30 40,22 Z" />
    
    <!-- Top circle -->
    <circle cx="40" cy="28" r="6" fill="#FFFFFF" opacity="0.9" />
    
    <!-- Highlight -->
    <circle cx="38" cy="26.5" r="2.4" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Text on right -->
  <text x="90" y="52" font-family="'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="36" font-weight="700" 
        fill="#0052CC" letter-spacing="-0.8">
    OTRIS AI
  </text>
</svg>
