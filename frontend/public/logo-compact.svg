<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="blueGradientCompact" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0052CC" stop-opacity="1"/>
    </linearGradient>
    
    <filter id="glowEffectCompact" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softShadowCompact" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Glow background -->
  <g opacity="0.1" filter="url(#glowEffectCompact)">
    <path fill="#0052CC" d="M60,10 Q95,10 95,45 L95,85 Q95,110 60,110 Q25,110 25,85 L25,45 Q25,10 60,10 Z" />
  </g>

  <!-- Main shape with filter -->
  <g filter="url(#softShadowCompact)">
    <path fill="url(#blueGradientCompact)" d="M60,12 Q93,12 93,45 L93,85 Q93,108 60,108 Q27,108 27,85 L27,45 Q27,12 60,12 Z" />
    
    <path fill="#FFFFFF" opacity="0.95" d="M60,32 Q77,44 77,70 Q77,88 60,88 Q43,88 43,70 Q43,44 60,32 Z" />
    
    <circle cx="60" cy="38" r="9" fill="#FFFFFF" opacity="0.9" />
    
    <circle cx="57" cy="36" r="3.5" fill="#FFFFFF" opacity="0.4" />
  </g>
</svg>
